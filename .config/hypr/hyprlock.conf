# Lock screen: blurred current wallpaper, clock, and a pill-shaped password field.
# Bound to SUPER + CTRL + L in hyprland.lua. Font falls back to Roboto if Inter is missing.

$font = Inter, Roboto

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = ease, 0.25, 0.1, 0.25, 1
    animation = fadeIn, 1, 4, ease
    animation = fadeOut, 1, 4, ease
    animation = inputFieldDots, 1, 2, ease
}

# The theme's framed wallpaper, kept up to date by tinty-hook.sh
background {
    monitor =
    path = ~/.local/state/theme/wallpaper.png
    blur_passes = 3
    blur_size = 6
    brightness = 0.7
    vibrancy = 0.2
}

# Time
label {
    monitor =
    text = $TIME
    font_family = $font Light
    font_size = 110
    color = rgba(255, 255, 255, 0.95)
    shadow_passes = 2
    shadow_size = 4
    position = 0, 220
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    font_family = $font
    font_size = 20
    color = rgba(255, 255, 255, 0.8)
    shadow_passes = 2
    shadow_size = 3
    position = 0, 110
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    rounding = -1
    outline_thickness = 2
    outer_color = rgba(255, 255, 255, 0.25)
    inner_color = rgba(20, 20, 24, 0.45)
    font_color = rgba(255, 255, 255, 0.95)
    font_family = $font
    check_color = rgba(130, 170, 255, 0.9)
    fail_color = rgba(240, 100, 100, 0.9)
    capslock_color = rgba(230, 190, 90, 0.9)
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    fade_on_empty = false
    placeholder_text = <span foreground="##ffffffaa">Password</span>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    shadow_passes = 2
    shadow_size = 6
    position = 0, -40
    halign = center
    valign = center
}

# User
label {
    monitor =
    text = $USER
    font_family = $font Medium
    font_size = 14
    color = rgba(255, 255, 255, 0.7)
    shadow_passes = 1
    position = 0, -110
    halign = center
    valign = center
}
