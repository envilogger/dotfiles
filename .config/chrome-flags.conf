# Read by the /usr/bin/google-chrome-stable wrapper, which passes every
# non-comment line to the real binary. Works no matter who launches Chrome
# (elephant, walker, a terminal), since all .desktop entries use the wrapper.
#
# Chrome's binary has no OZONE_PLATFORM env var, only the --ozone-platform
# switch, so setting the variable in hyprland.lua has no effect.

# Run natively on Wayland instead of XWayland, so screen sharing goes through
# xdg-desktop-portal instead of an empty XWayland root window
--ozone-platform=wayland
