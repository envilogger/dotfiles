<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Requires the ttf-apple-emoji package (AUR). -->

  <!-- Resolve the generic "emoji" family to Apple Color Emoji. -->
  <alias binding="same">
    <family>emoji</family>
    <prefer><family>Apple Color Emoji</family></prefer>
  </alias>

  <!-- Emoji fallback for the generic families. -->
  <alias binding="same">
    <family>sans-serif</family>
    <default><family>Apple Color Emoji</family></default>
  </alias>
  <alias binding="same">
    <family>serif</family>
    <default><family>Apple Color Emoji</family></default>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <default><family>Apple Color Emoji</family></default>
  </alias>

  <!-- Other emoji fonts map to Apple Color Emoji. -->
  <match target="pattern">
    <test qual="any" name="family"><string>Noto Color Emoji</string></test>
    <edit name="family" mode="assign" binding="same"><string>Apple Color Emoji</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Segoe UI Emoji</string></test>
    <edit name="family" mode="assign" binding="same"><string>Apple Color Emoji</string></edit>
  </match>
</fontconfig>
