# Fixed graph quantum: starting a capture stream (Google Meet mic) must not
# renegotiate the quantum and interrupt playback.
context.properties = {
    default.clock.rate        = 48000
    default.clock.quantum     = 1024
    default.clock.min-quantum = 1024
    default.clock.max-quantum = 1024

    # Pin it so no client can pull the graph to another quantum.
    default.clock.force-quantum = 1024
}
