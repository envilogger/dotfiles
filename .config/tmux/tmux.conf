# Options to make tmux more pleasant
set -g default-terminal "tmux-256color"

# Colours come from tinty: theme.conf is written by tinty-hook.sh on `tinty apply`
# and sets the @thm_* colours used below plus the pane/message/copy-mode styles.
source-file -q ~/.config/tmux/theme.conf

# Status bar, after Omarchy's: at the top, the session in a rounded accent pill, plain
# "index:name" tabs, and COPY/PREFIX/ZOOM flags with the hostname on the right.
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""
set -g status-left "#[fg=#{@thm_accent},bg=default]\uE0B6#[fg=#{@thm_bg},bg=#{@thm_accent},bold]#S#[fg=#{@thm_accent},bg=default,nobold]\uE0B4 "
set -g status-right "#[fg=#{@thm_accent}]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#{@thm_dim}]#h "
set -g window-status-format "#[fg=#{@thm_dim}] #I:#W "
set -g window-status-current-format "#[fg=#{@thm_accent},bold] #I:#W "

# Change the default prefix key from 'C-b' to 'C-a'
set -g prefix C-a
unbind C-b
bind C-a send-prefix

#set -s extended-keys on
#set-option -g xterm-keys on
#set -as terminal-features 'xterm*:extkeys'
#set-option -g allow-passthrough on

# Set base index for windows and panes to 1
set -g base-index 1
setw -g pane-base-index 1

# Close gaps in window numbers when a window is closed
set -g renumber-windows on

# Keep more scrollback (applies to panes opened from now on)
set -g history-limit 50000

# Add mouse support
set -g mouse on

# Add keybinding for reloading the config file
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# Add vim-like pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Split panes using | and -
bind | split-window -h
bind - split-window -v

# Resize panes using Shift + vim keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Use app name as tab name
# set-option -g allow-rename on
# set-option -g automatic-rename off
# set-option -g set-titles off
# set-option -g set-titles-string '#T'
set-window-option -g automatic-rename off
set-option -g allow-rename off


# List of plugins (installed by tpm into ~/.config/tmux/plugins; prefix + I installs)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# Copy-paste stuff
set -g @plugin 'tmux-plugins/tmux-yank'

# run ~/.config/tmux/plugins/tmux-cpu/cpu.tmux
# run ~/.config/tmux/plugins/tmux-battery/battery.tmux

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
