# tinty: https://github.com/tinted-theming/tinty
shell = "bash -c '{}'"
default-scheme = "base16-nord"

# No app templates yet. An explicit empty list stops tinty from adding its default
# tinted-shell item, which would recolour the terminal on every apply.
items = []

# Run on every apply, with the scheme's colours in TINTY_SCHEME_* variables.
hooks = [
    "$HOME/.config/quickshell/tinty-hook.sh",
    "$HOME/.config/hypr/tinty-hook.sh",
    "$HOME/.config/ghostty/tinty-hook.sh",
    "$HOME/.config/tmux/tinty-hook.sh",
    "$HOME/.config/dunst/tinty-hook.sh",
    "$HOME/.config/btop/tinty-hook.sh",
    "$HOME/.config/gtk-3.0/tinty-hook.sh",
    "$HOME/.config/lazygit/tinty-hook.sh",
]
