# Generated by matugen from the current wallpaper (see ~/.config/matugen/config.toml);
# edits are overwritten. Apply with: tinty apply base24-wallpaper-light
# Lightness is pinned per slot (the one-*-dimmed ramp), so only hue follows the wallpaper.
system: "base24"
name: "Wallpaper Light"
author: "matugen, generated from {{image}}"
description: "Light scheme derived from the wallpaper; neutrals take the wallpaper's hue, accents are Material-toned for even contrast"
variant: "light"
palette:
  base00: "{{ colors.surface_container_high.light.hex | to_color | set_lightness: 91 | format: "hex" }}"
  base01: "{{ colors.surface_container_high.light.hex | to_color | set_lightness: 88 | format: "hex" }}"
  base02: "{{ colors.surface_container_high.light.hex | to_color | set_lightness: 80 | format: "hex" }}"
  base03: "{{ colors.surface_container_high.light.hex | to_color | set_lightness: 64 | format: "hex" }}"
  base04: "{{ colors.surface_container_high.light.hex | to_color | set_lightness: 44 | format: "hex" }}"
  base05: "{{ colors.surface_container_high.light.hex | to_color | set_lightness: 24 | format: "hex" }}"
  base06: "{{ colors.surface_container_high.light.hex | to_color | set_lightness: 14 | format: "hex" }}"
  base07: "{{ colors.surface_container_high.light.hex | to_color | set_lightness: 4 | format: "hex" }}"
  base08: "{{ colors.red.light.hex | to_color | format: "hex" }}"
  base09: "{{ colors.orange.light.hex | to_color | format: "hex" }}"
  base0A: "{{ colors.yellow.light.hex | to_color | format: "hex" }}"
  base0B: "{{ colors.green.light.hex | to_color | format: "hex" }}"
  base0C: "{{ colors.cyan.light.hex | to_color | format: "hex" }}"
  base0D: "{{ colors.blue.light.hex | to_color | format: "hex" }}"
  base0E: "{{ colors.magenta.light.hex | to_color | format: "hex" }}"
  base0F: "{{ colors.brown.light.hex | to_color | set_saturation: 34.0 | set_lightness: 36 | format: "hex" }}"
  base10: "{{ colors.surface_container_high.light.hex | to_color | set_lightness: 94 | format: "hex" }}"
  base11: "{{ colors.surface_container_high.light.hex | to_color | set_lightness: 98 | format: "hex" }}"
  base12: "{{ colors.red.light.hex | to_color | lighten: 6.0 | format: "hex" }}"
  base13: "{{ colors.yellow.light.hex | to_color | lighten: 6.0 | format: "hex" }}"
  base14: "{{ colors.green.light.hex | to_color | lighten: 6.0 | format: "hex" }}"
  base15: "{{ colors.cyan.light.hex | to_color | lighten: 6.0 | format: "hex" }}"
  base16: "{{ colors.blue.light.hex | to_color | lighten: 6.0 | format: "hex" }}"
  base17: "{{ colors.magenta.light.hex | to_color | lighten: 6.0 | format: "hex" }}"
