# Generated by matugen from the current wallpaper (see ~/.config/matugen/config.toml);
# edits are overwritten. Apply with: tinty apply base24-wallpaper-dark
# Lightness is pinned per slot (the one-*-dimmed ramp), so only hue follows the wallpaper.
system: "base24"
name: "Wallpaper Dark"
author: "matugen, generated from {{image}}"
description: "Dark scheme derived from the wallpaper; neutrals take the wallpaper's hue, accents are Material-toned for even contrast"
variant: "dark"
palette:
  base00: "{{ colors.surface_container_high.dark.hex | to_color | set_lightness: 18 | format: "hex" }}"
  base01: "{{ colors.surface_container_high.dark.hex | to_color | set_lightness: 28 | format: "hex" }}"
  base02: "{{ colors.surface_container_high.dark.hex | to_color | set_lightness: 36 | format: "hex" }}"
  base03: "{{ colors.surface_container_high.dark.hex | to_color | set_lightness: 37 | format: "hex" }}"
  base04: "{{ colors.surface_container_high.dark.hex | to_color | set_lightness: 60 | format: "hex" }}"
  base05: "{{ colors.surface_container_high.dark.hex | to_color | set_lightness: 71 | format: "hex" }}"
  base06: "{{ colors.surface_container_high.dark.hex | to_color | set_lightness: 90 | format: "hex" }}"
  base07: "{{ colors.surface_container_high.dark.hex | to_color | set_lightness: 100 | format: "hex" }}"
  base08: "{{ colors.red.dark.hex | to_color | format: "hex" }}"
  base09: "{{ colors.orange.dark.hex | to_color | format: "hex" }}"
  base0A: "{{ colors.yellow.dark.hex | to_color | format: "hex" }}"
  base0B: "{{ colors.green.dark.hex | to_color | format: "hex" }}"
  base0C: "{{ colors.cyan.dark.hex | to_color | format: "hex" }}"
  base0D: "{{ colors.blue.dark.hex | to_color | format: "hex" }}"
  base0E: "{{ colors.magenta.dark.hex | to_color | format: "hex" }}"
  base0F: "{{ colors.brown.dark.hex | to_color | set_saturation: 34.0 | set_lightness: 50 | format: "hex" }}"
  base10: "{{ colors.surface_container_high.dark.hex | to_color | set_lightness: 15 | format: "hex" }}"
  base11: "{{ colors.surface_container_high.dark.hex | to_color | set_lightness: 11 | format: "hex" }}"
  base12: "{{ colors.red.dark.hex | to_color | lighten: 8.0 | format: "hex" }}"
  base13: "{{ colors.yellow.dark.hex | to_color | lighten: 8.0 | format: "hex" }}"
  base14: "{{ colors.green.dark.hex | to_color | lighten: 8.0 | format: "hex" }}"
  base15: "{{ colors.cyan.dark.hex | to_color | lighten: 8.0 | format: "hex" }}"
  base16: "{{ colors.blue.dark.hex | to_color | lighten: 8.0 | format: "hex" }}"
  base17: "{{ colors.magenta.dark.hex | to_color | lighten: 8.0 | format: "hex" }}"
